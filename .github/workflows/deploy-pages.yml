name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Tests import the plain source paths, so validate before cache keys are added.
      - name: Validate site
        run: npm run check
      - name: Add content-hash cache keys to modules and stylesheet
        run: |
          node scripts/version-assets.mjs
          node scripts/version-assets.mjs --verify
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist
      # The artifact list can lag behind a successful upload.
      - name: Wait for the Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ -z "$PAGES_ARTIFACT_ID" ]]; then
            echo "::error::The Pages upload did not return an artifact ID."
            exit 1
          fi
          for attempt in {1..12}; do
            if listed_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id') \
              && [[ "$listed_id" == "$PAGES_ARTIFACT_ID" ]]; then
              # Allow the deploy action's artifact service to catch up with the REST API.
              sleep 5
              exit 0
            fi
            if (( attempt < 12 )); then sleep 5; fi
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT_ID is not listed for this run."
          exit 1
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
